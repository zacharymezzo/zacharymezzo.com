# ─────────────────────────────────────────────────────────────
#  Everything on the site lives in this file.
#
#  SECTIONS appear in the order listed, and each gets a nav link.
#  A section has:
#    title:  heading + nav label
#    id:     (optional) anchor for the URL, e.g. #releases. Defaults from title.
#    type:   (optional) default item type for the section: album | link | youtube | soundcloud
#    items:  the entries (see below)
#
#  The special section `type: about` takes `image:` and `bio:` instead of items.
#
#  ITEM fields:
#    type:   album | link | youtube | soundcloud   (overrides the section default)
#    youtube: embeds the first link's video, with title/note/links below
#    soundcloud: embeds the first link's SoundCloud player, with title/note/links below
#    artist: (optional) shown in bold before the title
#    title:  release / work name
#    note:   (optional) roles or a description, e.g. "Violin, String Arrangement"
#    image:  (album only) file in src/images/, e.g. "albums/home-movies.jpg".
#            Square works best. Leave it out and a placeholder tile is shown.
#    image_fit: (optional) "contain" to show a non-square image uncropped.
#    links:  list of { label, url }. For albums these appear when you
#            hover / tap the cover. For links, the first is the main link and
#            the rest show as "(+ label)".
# ─────────────────────────────────────────────────────────────

name: "Zachary Mezzo"
tagline: "Violinist & Composer, New York"
description: "Zachary Mezzo is an experimental violinist and composer from New York."
url: "https://zacharymezzo.com"   # used to build the full link to the share image

# Picture shown when the site is shared (iMessage, Instagram, Slack, etc.).
# A file in src/images/. Swap the file, or point this at a different one.
# About 1200×630 is ideal, but any size works.
